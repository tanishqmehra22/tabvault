<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabVault Dashboard</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dash">
  <aside id="side" class="side">
    <div class="brand"><img src="assets/icon32.png" alt="" width="28" height="28"><h1>TabVault</h1></div>
    <div class="stats"><div><span class="faint">Tabs saved</span><b id="statTabs">0</b></div><div><span class="faint">Sessions</span><b id="statSessions">0</b></div></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="local"><span id="shieldIcon"></span> Local-first. Data never leaves this device.</div>
  </aside>
  <div class="content">
    <header class="bar">
      <button id="menuBtn" class="ibtn menu" type="button" aria-label="Toggle navigation"></button>
      <div class="gsearch"><span id="searchIcon"></span><input id="gq" class="input" type="search" placeholder="Search saved tabs, sessions, domains…" aria-label="Search everything" autocomplete="off"><span class="kbd">/</span></div>
      <button id="quickSave" class="btn primary" type="button"></button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
